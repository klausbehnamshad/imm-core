# Synthetic example collection configuration for IMM-Core tools.
# This file is a valid test case for tools/validate.py and
# tools/imm2dataverse.py. It is NOT a real collection: the licence below
# is no recommendation for real interviews, and a synthetic configuration
# must never trigger a real repository write (the tools of this release
# contain no write path at all).

[collection]
code = "OHX"
name = "Example oral history collection"
synthetic = true
record_id_pattern = "^[0-9]{4}-[0-9]{2}-[0-9]{2}_OHX_[0-9]{4}$"
consent_values = ["research-only", "teaching", "public", "embargoed"]

[dataverse]
other_id_agency = "Example Institute"
subject = ["Arts and Humanities"]
kind_of_data = ["Oral history interview"]
export_consent = ["public"]
export_access = ["open"]
export_record_id = false
export_interviewer = false
license_name = "CC BY 4.0"
license_uri = "http://creativecommons.org/licenses/by/4.0"
allowed_hosts = ["doi.org"]
names_file = ""

[[dataverse.author]]
name = "Example Project"
affiliation = "Example Institute"

[dataverse.contact]
name = "Example collection contact"
email = "collection@example.org"
