name: validate

on:
  push:
  pull_request:

jobs:
  consistency:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "jsonschema>=4.18"
      - run: python scripts/check_consistency.py
      - name: README quick start still works
        run: npx --yes -p ajv-cli@5 -p ajv-formats@3 ajv validate -c ajv-formats -s schema/core.schema.json -d "examples/*.json"
